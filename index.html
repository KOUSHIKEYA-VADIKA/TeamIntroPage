<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Introduction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            color: #1f3c88;
        }

        .team {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .member {
            background: white;
            width: 250px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .member img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
        }

        .member h2 {
            margin-bottom: 5px;
        }

        .department {
            color: #666;
        }
    </style>
</head>

<body>

    <h1>Our Team</h1>

    <div class="team">

        <div class="member">
            <img src="https://via.placeholder.com/150" alt="Team Member">
            <h2>Koushikeya Vadika</h2>
            <p class="department">Computer Science & Engineering</p>
        </div>

        <div class="member">
            <img src="https://via.placeholder.com/150" alt="Team Member">
            <h2>Team Member</h2>
            <p class="department">Product Development</p>
        </div>

    </div>

</body>
</html>
